<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SafeBrowser</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, system-ui, sans-serif; background:#1f1f1f; color:#eee; }
    body { display: flex; flex-direction: column; }

    /* Tab bar */
    #tabs {
      display: flex; align-items: stretch; gap: 4px;
      background: #141414; padding: 6px 8px 0 8px; min-height: 36px;
      border-bottom: 1px solid #000;
      overflow-x: auto;
    }
    .tab {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; max-width: 220px; min-width: 120px;
      background: #2a2a2a; color: #ccc; border-radius: 8px 8px 0 0;
      cursor: pointer; user-select: none; font-size: 13px;
      border: 1px solid #000; border-bottom: none;
    }
    .tab.active { background: #1f1f1f; color: #fff; }
    .tab .title { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tab .close {
      width: 18px; height: 18px; line-height: 16px; text-align: center;
      border-radius: 50%; background: transparent; color: #999;
    }
    .tab .close:hover { background:#444; color:#fff; }
    #newtab-btn {
      align-self: center; margin-left: 4px;
      width: 28px; height: 28px; border-radius: 50%;
      background: #2a2a2a; border: 1px solid #000; color:#ddd; cursor:pointer;
    }
    #newtab-btn:hover { background:#3a3a3a; }

    /* Address row */
    .chrome {
      display: flex; align-items: center; gap: 6px;
      padding: 8px; background: #1f1f1f;
    }
    button.nav {
      background: #333; color: #eee; border: 1px solid #444;
      border-radius: 6px; padding: 6px 10px; cursor: pointer;
    }
    button.nav:hover { background: #444; }
    #addr {
      flex: 1; padding: 8px 12px; border-radius: 8px;
      border: 1px solid #444; background: #111; color: #eee; font-size: 14px;
    }
    #mode-pill {
      font-size: 11px; padding: 4px 8px; border-radius: 999px;
      background: #2a2a2a; border: 1px solid #444; color: #bbb; cursor: pointer;
    }
    #mode-pill.lenient { background:#2c3e50; color:#9cf; border-color:#3a4f63; }
    #ad-pill {
      font-size: 11px; padding: 4px 8px; border-radius: 999px;
      background: #2c3e50; border: 1px solid #3a4f63; color: #9cf; cursor: pointer;
    }
    #ad-pill.off { background:#3a2a2a; color:#fbb; border-color:#5a3a3a; }

    /* Star (bookmark) button — sits inside the address bar visually */
    #star {
      background: transparent; color:#888; border:0; font-size:18px;
      cursor:pointer; padding: 0 6px;
    }
    #star.saved { color: #FBBC05; }

    /* Bookmarks panel — hidden by default, slides in from right */
    #bookmarks-panel {
      position: fixed; top: 80px; right: 12px; width: 360px; max-height: 70vh;
      background: #1c1c1e; border: 1px solid #444; border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0,0,0,.6);
      display: none; flex-direction: column; z-index: 20;
    }
    #bookmarks-panel.show { display: flex; }
    #bookmarks-panel header {
      display:flex; align-items:center; justify-content:space-between;
      padding: 10px 14px; border-bottom: 1px solid #333;
    }
    #bookmarks-panel header h3 { margin:0; font-size: 13px; opacity:.85; letter-spacing:1px; text-transform:uppercase; }
    #bookmarks-panel header button {
      background:transparent; color:#aaa; border:0; cursor:pointer; font-size:18px;
    }
    #bookmarks-list { overflow-y: auto; padding: 6px 0; }
    .bm-item {
      display:flex; align-items:center; gap: 8px;
      padding: 8px 14px; cursor: pointer; font-size: 13px;
    }
    .bm-item:hover { background:#2a2a2a; }
    .bm-item .bm-title { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#eee; }
    .bm-item .bm-host  { color:#888; font-size:11px; margin-left:6px; }
    .bm-item .bm-del   { color:#888; padding: 2px 6px; border-radius:4px; }
    .bm-item .bm-del:hover { color:#fff; background:#444; }
    #bookmarks-empty { padding: 16px; text-align:center; color:#888; font-size:12px; }

    /* Webview area: stack of webviews, only active is visible. */
    #views { flex: 1; position: relative; background:#000; }
    #views webview { position: absolute; inset: 0; border: 0; visibility: hidden; }
    #views webview.active { visibility: visible; }

    /* HTML5 video fullscreen: hide the chrome, let the active webview cover the window. */
    body.fullscreen #tabs,
    body.fullscreen .chrome { display: none !important; }
    body.fullscreen #views { position: fixed; inset: 0; z-index: 9999; }

    #toast {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: #222; color: #fff; padding: 10px 14px; border-radius: 8px;
      font-size: 13px; opacity: 0; transition: opacity .2s;
      max-width: 70vw; pointer-events: auto;
    }
    #toast.show { opacity: 1; }
    #toast a { color: #6cf; margin-left: 8px; cursor: pointer; }

    /* Cross-origin redirect confirmation */
    #confirm {
      position: fixed; left: 50%; top: 80px; transform: translateX(-50%);
      background: #1c1c1e; color: #fff; border: 1px solid #444;
      border-radius: 12px; padding: 16px 18px; min-width: 380px; max-width: 540px;
      box-shadow: 0 16px 48px rgba(0,0,0,.6); display: none; z-index: 10;
    }
    #confirm.show { display: block; }
    #confirm h4 { margin: 0 0 8px 0; font-size: 14px; color: #ffb74d; }
    #confirm .row { font-size: 12px; word-break: break-all; margin: 4px 0; opacity: .9; }
    #confirm .label { opacity:.6; margin-right:6px; }
    #confirm .actions { display:flex; gap:8px; justify-content:flex-end; margin-top: 12px; }
    #confirm button { border:0; border-radius:6px; padding:6px 12px; cursor:pointer; }
    #confirm .allow { background:#4285F4; color:#fff; }
    #confirm .block { background:#444; color:#eee; }
  </style>
</head>
<body>
  <div id="tabs">
    <button id="newtab-btn" title="New tab">+</button>
  </div>

  <div class="chrome">
    <button class="nav" id="back" title="Back">‹</button>
    <button class="nav" id="fwd"  title="Forward">›</button>
    <button class="nav" id="reload" title="Reload">⟳</button>
    <input id="addr" type="text" spellcheck="false" placeholder="Search Google or enter URL" />
    <button id="star" title="Bookmark this page (Cmd/Ctrl+D)">☆</button>
    <button class="nav" id="go">Go</button>
    <button class="nav" id="home">Home</button>
    <button class="nav" id="bookmarks-btn" title="Bookmarks (Cmd/Ctrl+B)">≡</button>
    <span id="mode-pill" title="Click to toggle Strict/Lenient">Strict</span>
    <span id="ad-pill"  title="Click to toggle ad-blocker (reloads tab)">Ads: ON</span>
  </div>

  <div id="views"></div>
  <div id="toast"></div>

  <div id="bookmarks-panel" role="dialog" aria-label="Bookmarks">
    <header>
      <h3>Bookmarks</h3>
      <button id="bookmarks-close" title="Close">×</button>
    </header>
    <div id="bookmarks-list"></div>
    <div id="bookmarks-empty" style="display:none">No bookmarks yet. Press ☆ or Cmd/Ctrl+D to save the current page.</div>
  </div>
  <div id="confirm">
    <h4>⚠ Cross-site redirect blocked</h4>
    <div class="row"><span class="label">You expected:</span><span id="cf-expected"></span></div>
    <div class="row"><span class="label">Page wants:</span><span id="cf-url"></span></div>
    <div class="actions">
      <button class="block" id="cf-block">Block</button>
      <button class="allow" id="cf-allow">Allow once</button>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
